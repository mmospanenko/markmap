<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>markmap editor playground</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: system-ui, sans-serif;
        color-scheme: light;
        background: #fff;
        color: #222;
      }
      body {
        display: grid;
        grid-template-columns: minmax(300px, 1fr) 2fr;
        grid-template-rows: auto 1fr;
      }
      header {
        grid-column: 1 / -1;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid #ddd;
      }
      header h1 {
        margin: 0 auto 0 0;
        font-size: 16px;
      }
      header a {
        color: inherit;
      }
      textarea#source {
        width: 100%;
        height: 100%;
        padding: 12px;
        border: 0;
        border-right: 1px solid #ddd;
        font:
          14px/1.5 ui-monospace,
          monospace;
        resize: none;
        outline: none;
      }
      #stage {
        position: relative;
        min-width: 0;
        min-height: 0;
        font:
          16px/20px system-ui,
          sans-serif;
        color: #333;
      }
      #stage:focus {
        outline: none;
      }
      #stage:focus-visible {
        outline: 2px solid rgba(74, 144, 226, 0.6);
        outline-offset: -2px;
      }
      svg {
        width: 100%;
        height: 100%;
        display: block;
        background: var(--mm-bg);
      }
      .hint {
        padding: 6px 12px;
        border-top: 1px solid #ddd;
        font-size: 12px;
        color: #666;
        grid-column: 2;
      }
      body {
        grid-template-rows: auto 1fr auto;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>markmap editor</h1>
      <a href="/">viewer playground</a>
      <span id="status"></span>
      <button id="edit">Edit</button>
      <button id="fit">Fit</button>
      <button id="undo">Undo</button>
      <button id="redo">Redo</button>
    </header>
    <textarea id="source" spellcheck="false"></textarea>
    <div id="stage"></div>
    <div class="hint">
      Click a node, Enter adds a sibling, Tab a child, Shift+Tab outdents, F2 edits, Esc cancels,
      Cmd/Ctrl+Z undoes.
    </div>
    <script type="module" src="./editor.ts"></script>
  </body>
</html>
